# Kubernetes Secret Demo (Opaque Secret with base64 encoded credentials)
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: demo-app
type: Opaque
data:
  # Base64 encoded values:
  # 'admin' -> YWRtaW4=
  # 'SuperSecretPassword123!' -> U3VwZXJTZWNyZXRQYXNzd29yZDEyMyE=
  DB_USERNAME: YWRtaW4=
  DB_PASSWORD: U3VwZXJTZWNyZXRQYXNzd29yZDEyMyE=
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-consumer-pod
spec:
  containers:
  - name: secure-app
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Secret successfully injected!'; echo DB_USER=$DB_USER; echo 'Password Length:' ${#DB_PASS}; sleep 3600"]
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_USERNAME
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
