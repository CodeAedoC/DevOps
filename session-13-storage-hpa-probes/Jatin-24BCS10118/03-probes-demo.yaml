# Health Probes Demo: Liveness, Readiness, and Startup Probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilient-probed-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probed-app
  template:
    metadata:
      labels:
        app: probed-app
    spec:
      containers:
      - name: web
        image: nginx:1.24-alpine
        ports:
        - containerPort: 80
        # 1. Startup Probe: Gives slow-booting applications time to initialize
        startupProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 30
          periodSeconds: 2
        # 2. Readiness Probe: Checks if the pod is ready to receive network traffic from Service
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # 3. Liveness Probe: Detects container deadlocks/hangs and restarts container automatically
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
