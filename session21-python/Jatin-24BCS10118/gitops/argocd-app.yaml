apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-capstone-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Jatin-24BCS10118/devops-heros.git'
    targetRevision: HEAD
    path: session21-python/Jatin-24BCS10118/kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-capstone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
