<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Application Docker Demo</title>
  <!-- React & Babel CDN for standalone lightweight production bundle -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; max-width: 500px; }
    .title { color: #61dafb; font-size: 2.2rem; margin-bottom: 10px; }
    .badge { display: inline-block; padding: 6px 14px; background: rgba(97, 218, 251, 0.2); color: #61dafb; border-radius: 9999px; font-weight: 600; font-size: 0.85rem; margin-top: 15px; }
    .btn { margin-top: 20px; padding: 10px 20px; background: #61dafb; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [count, setCount] = React.useState(0);
      return (
        <div className="card">
          <h1 className="title">Hello World from React App!</h1>
          <p>Student: Jatin (Enrollment: 24BCS10118)</p>
          <div className="badge">Containerized via Docker & Nginx</div>
          <br/>
          <button className="btn" onClick={() => setCount(c => c + 1)}>
            Interactive State Click Counter: {count}
          </button>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
