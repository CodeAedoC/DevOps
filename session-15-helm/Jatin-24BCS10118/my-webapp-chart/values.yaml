replicaCount: 3

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.24-alpine"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  host: "helm-app.local"

env:
  APP_ENV: "production"
  RELEASE_TRACK: "stable"
