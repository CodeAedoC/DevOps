apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-secured-app
  labels:
    app: secured-app
    tier: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secured-app
  template:
    metadata:
      labels:
        app: secured-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: web
        image: nginx:1.24-alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-secured-service
spec:
  type: ClusterIP
  selector:
    app: secured-app
  ports:
  - port: 80
    targetPort: 8080
