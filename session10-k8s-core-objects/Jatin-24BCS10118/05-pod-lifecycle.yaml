# Pod Lifecycle Demonstration (Init Containers, Lifecycle Hooks, Probes)
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-demo-pod
  labels:
    app: lifecycle-test
spec:
  initContainers:
  - name: init-myservice
    image: busybox:1.36
    command: ['sh', '-c', 'echo "[Init] Pre-flight checks running..."; sleep 3; echo "[Init] Done!"']
  containers:
  - name: main-app
    image: nginx:1.24-alpine
    lifecycle:
      postStart:
        exec:
          command: ["/bin/sh", "-c", "echo 'Application Initialized via postStart Hook' > /usr/share/nginx/html/status.html"]
      preStop:
        exec:
          command: ["/bin/sh", "-c", "echo 'Gracefully draining connections before SIGKILL' >> /tmp/prestop.log; sleep 5"]
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 2
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
