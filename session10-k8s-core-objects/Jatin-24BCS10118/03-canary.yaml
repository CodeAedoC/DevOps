# 03. Canary Deployment Strategy
# Stable Release (90% of traffic handled by 9 replicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable-prod
  labels:
    app: canary-demo
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo
        track: stable
    spec:
      containers:
      - name: web
        image: nginx:1.24-alpine
        ports:
        - containerPort: 80
---
# Canary Release (10% of traffic handled by 1 replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary-test
  labels:
    app: canary-demo
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: canary-demo
        track: canary
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
# Service routing across both Stable and Canary via shared label 'app: canary-demo'
apiVersion: v1
kind: Service
metadata:
  name: canary-service
spec:
  type: ClusterIP
  selector:
    app: canary-demo
  ports:
  - port: 80
    targetPort: 80
